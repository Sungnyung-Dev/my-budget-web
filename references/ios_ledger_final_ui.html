<script>
(()=>{
const root=document.getElementById('ledger-app');const $=q=>root.querySelector(q);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Math.abs(n).toLocaleString('ko-KR');const pad=n=>String(n).padStart(2,'0');const key=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
let id=100;const rows=[];
const base=[ [1350000,235000,165000,450000,65000],[1320000,195000,154000,450000,42000],[1530000,247000,134000,450000,55000],[1360000,218000,169000,450000,71000],[1420000,251000,145000,450000,48000],[1480000,198000,137000,450000,51000],[1400000,310000,177000,450000,78000],[1660000,283000,172000,450000,61000],[1500000,260000,149000,450000,56000],[1560000,230000,196000,450000,65000] ];
base.forEach((v,i)=>{const m=i+1;[[3,'월급','급여','income',v[0]],[4,'월세','주거','expense',v[3]],[9,'식비','식비','expense',v[1]],[15,'쇼핑','쇼핑','expense',v[2]],[23,'교통비','교통','expense',v[4]]].forEach(a=>rows.push({id:++id,date:key(2026,m,a[0]),name:a[1],category:a[2],type:a[3],amount:a[4]}))});
[[1,'월세','주거','expense',450000],[2,'점심 식사','식비','expense',12000],[3,'월급','급여','income',1000000],[3,'교통비','교통','expense',30000],[5,'배달 음식','식비','expense',24000],[6,'장보기','생활','expense',78900],[7,'생필품','생활','expense',100300],[8,'옷 구매','쇼핑','expense',128000],[10,'카페','카페','expense',5800],[10,'아르바이트 급여','급여','income',450000],[11,'점심 식사','식비','expense',9000],[11,'편의점','생활','expense',4500],[11,'용돈','용돈','income',50000]].forEach(a=>rows.push({id:++id,date:key(2026,11,a[0]),name:a[1],category:a[2],type:a[3],amount:a[4]}));
const s={tab:'history',page:'main',year:2026,month:11,day:11,statsMode:'month',chartMonth:11,records:rows,cat:{expense:['식비','카페','교통','쇼핑','생활','주거','기타'],income:['급여','용돈','기타']},edit:null,categoryEditor:null};
const selected=()=>key(s.year,s.month,s.day);const monthRows=()=>s.records.filter(r=>r.date.startsWith(`${s.year}-${pad(s.month)}-`));const sum=a=>({inc:a.filter(r=>r.type==='income').reduce((t,r)=>t+r.amount,0),out:a.filter(r=>r.type==='expense').reduce((t,r)=>t+r.amount,0)});const dateLabel=(d)=>{const [y,m,dd]=d.split('-').map(Number);return `${y}년 ${m}월 ${dd}일 ${'일월화수목금토'[new Date(y,m-1,dd).getDay()]}요일`};
const icons={home:'<path d="m3 10 9-7 9 7v10h-6v-7H9v7H3z"/>',history:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',stats:'<path d="M21 12A9 9 0 1 1 12 3v9zM15 3.5A9 9 0 0 1 20.5 9H15z"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="9" cy="18" r="2" fill="white"/>'};
const header=(title,sub)=>`<div class="header"><div class="eyebrow">MY LEDGER</div><h1>${title}</h1><div class="sub">${sub||''}</div></div>`;
const monthNav=(year,month,mode)=>`<div class="monthnav"><button class="chev" data-shift="-1" data-mode="${mode}" aria-label="이전 ${mode==='year'?'연도':'월'}">‹</button><b>${mode==='year'?`${year}년`:`${year}년 ${month}월`}</b><button class="chev" data-shift="1" data-mode="${mode}" aria-label="다음 ${mode==='year'?'연도':'월'}">›</button></div>`;
const summary=(r)=>{const a=sum(r);return `<div class="summary"><div class="sumcell"><div class="slbl">수입</div><div class="snum">${num(a.inc)}</div></div><div class="sumcell"><div class="slbl">지출</div><div class="snum">${num(a.out)}</div></div><div class="sumcell"><div class="slbl">수입 − 지출</div><div class="snum">${a.inc-a.out<0?'−':''}${num(a.inc-a.out)}</div></div></div>`};
const txSymbol=c=>({식비:'⌁',카페:'◯',교통:'↗',쇼핑:'◇',생활:'▤',주거:'⌂',급여:'↓',용돈:'+',기타:'·'})[c]||'•';
const txRow=r=>`<button class="tx" data-tx="${r.id}"><span class="txleft"><span class="txicon">${txSymbol(r.category)}</span><span style="min-width:0"><div class="txname">${esc(r.name)}</div><div class="txcat">${esc(r.category)}</div></span></span><span class="txnum ${r.type==='income'?'income':''}">${r.type==='income'?'+':'−'}${num(r.amount)}원</span></button>`;
function history(){const m=monthRows(),start=new Date(s.year,s.month-1,1).getDay(),days=new Date(s.year,s.month,0).getDate();let cells='';for(let i=0;i<Math.ceil((days+start)/7)*7;i++){const d=i-start+1;if(d<1||d>days){cells+='<span></span>';continue}const a=m.filter(r=>Number(r.date.slice(-2))===d);cells+=`<button class="day ${s.day===d?'sel':''}" data-day="${d}"><span class="daynum">${d}</span><span class="dots">${a.some(r=>r.type==='expense')?'<i class="dot"></i>':''}${a.some(r=>r.type==='income')?'<i class="dot light"></i>':''}</span></button>`}const a=m.filter(r=>r.date===selected()).sort((x,y)=>y.id-x.id),z=sum(a);return `${header('내역','달력에서 날짜를 선택해 기록을 확인하세요')}${monthNav(s.year,s.month,'month')}${summary(m)}<div class="weekdays">${[...'일월화수목금토'].map(v=>`<div class="wd">${v}</div>`).join('')}</div><div class="calendar">${cells}</div><div class="hint">● 지출 &nbsp; ● 수입 · 거래가 있는 날짜 표시</div><div class="divider"></div><div class="sectionhead"><div><div class="sectiontitle">${s.month}월 ${s.day}일 · ${'일월화수목금토'[new Date(s.year,s.month-1,s.day).getDay()]}요일</div><div class="daymeta"><span>수입 +${num(z.inc)}</span><span>지출 −${num(z.out)}</span></div></div><span class="muted">${a.length}건</span></div>${a.length?a.map(txRow).join(''):'<div class="empty">선택한 날짜에 거래가 없습니다.<br>+ 버튼으로 새 거래를 추가해 보세요.</div>'}`}
function bars(records){const out={};records.filter(r=>r.type==='expense').forEach(r=>out[r.category]=(out[r.category]||0)+r.amount);const z=Object.entries(out).sort((a,b)=>b[1]-a[1]);const total=Object.values(out).reduce((a,b)=>a+b,0);return z.length?z.map(([c,v])=>`<div class="barrow"><div class="bartext"><span>${esc(c)}</span><b>${num(v)}원 · ${Math.round(100*v/total)}%</b></div><div class="bartrack"><div class="barfill" style="width:${v/total*100}%"></div></div></div>`).join(''):'<div class="empty">이 기간의 지출 내역이 없습니다.</div>'}
function home(){const a=monthRows(),z=sum(a),recent=[...a].sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).slice(0,3);return `${header('홈','이번 달 가계부를 한눈에')}${monthNav(s.year,s.month,'month')}<div class="homehero"><div class="small">이번 달 지출</div><div class="bigmoney">₩ ${num(z.out)}</div><div class="homerow"><span class="small">수입 − 지출</span><strong>${z.inc-z.out<0?'−':'+'}${num(z.inc-z.out)}원</strong></div></div><div class="ministats"><div class="statbox"><span class="small">이번 달 수입</span><strong>${num(z.inc)}원</strong></div><div class="statbox"><span class="small">거래 건수</span><strong>${a.length}건</strong></div></div><div class="sectionhead"><span class="sectiontitle">카테고리별 지출</span></div>${bars(a)}<div class="sectionhead"><span class="sectiontitle">최근 거래</span><button class="link" data-goto="history">전체 보기 ›</button></div>${recent.length?recent.map(txRow).join(''):'<div class="empty">최근 거래가 없습니다.</div>'}`}
function yearGraph(){const months=Array.from({length:12},(_,i)=>s.records.filter(r=>r.date.startsWith(`${s.year}-${pad(i+1)}-`)));const sums=months.map(sum),max=Math.max(1,...sums.flatMap(z=>[z.inc,z.out]));const step=82,w=step*12,baseY=165,height=150;let chart=`<div class="chartcanvas" style="width:${w}px">`;
sums.forEach((z,i)=>{const bh=z.out/max*height;chart+=`<div class="chartbar" style="left:${i*step+26}px;top:${baseY-bh}px;width:28px;height:${bh}px"></div><button class="chartlabel ${months[i].length?'':'missing'} ${s.chartMonth===i+1?'chosen':''}" data-chartmonth="${i+1}" style="left:${i*step}px">${i+1}월</button>`});
const valid=sums.map((z,i)=>({x:i*step+40,y:baseY-z.inc/max*height,exists:months[i].length>0})).filter(z=>z.exists);
chart+=`<svg viewBox="0 0 ${w} 171" width="${w}" height="171" aria-hidden="true">${[15,65,115,165].map(y=>`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#ececec" stroke-width="1"/>`).join('')}${valid.length?`<polyline points="${valid.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#181818" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${valid.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#181818" stroke-width="2"/>`).join('')}`:''}</svg></div>`;
return `<div class="sectionhead"><span class="sectiontitle">월별 수입·지출 추이</span></div><div class="legend"><span><i class="legendbar"></i>지출 · 막대</span><span><i class="legendline"></i>수입 · 선</span></div><div class="chartwrap"><div class="chartscroll" id="yearscroll">${chart}</div></div><div class="chartpagenav"><button data-scroll="-1">‹ 이전</button><span>그래프를 좌우로 밀어보세요</span><button data-scroll="1">다음 ›</button></div><div class="note">선과 막대는 같은 금액 축을 사용합니다. 데이터가 없는 달에는 표시되지 않습니다.</div>`}
function stats(){const mode=s.statsMode;const a=mode==='year'?s.records.filter(r=>r.date.startsWith(s.year+'-')):monthRows();const v=sum(a);const spendDates=new Set(a.filter(r=>r.type==='expense').map(r=>r.date)).size;let out=`${header('통계','수입과 소비 흐름을 분석하세요')}<div class="mode"><button data-stats="month" class="${mode==='month'?'active':''}">월간</button><button data-stats="year" class="${mode==='year'?'active':''}">연간</button></div>${monthNav(s.year,s.month,mode==='year'?'year':'month')}${summary(a)}`;
if(mode==='year'){const activeMonths=new Set(a.map(r=>r.date.slice(0,7))).size;out+=yearGraph()+`<div class="sectionhead"><span class="sectiontitle">연간 요약</span></div><div class="settingrow"><span>기록된 월</span><b>${activeMonths}개월</b></div><div class="settingrow"><span>기록된 월 평균 지출</span><b>${num(activeMonths?Math.round(v.out/activeMonths):0)}원</b></div><div class="sectionhead"><span class="sectiontitle">연간 카테고리별 지출</span></div>${bars(a)}`}
else{out+=`<div class="sectionhead"><span class="sectiontitle">카테고리별 지출</span></div>${bars(a)}<div class="sectionhead"><span class="sectiontitle">이달의 소비 정보</span></div><div class="settingrow"><span>지출 건수</span><b>${a.filter(r=>r.type==='expense').length}건</b></div><div class="settingrow"><span>지출한 날짜</span><b>${spendDates}일</b></div><div class="settingrow"><span>지출일 평균</span><b>${num(spendDates?Math.round(v.out/spendDates):0)}원</b></div>`}return out}
function settings(){return `${header('설정','가계부를 내 방식대로 관리하세요')}<div class="settingslabel">관리</div><button class="settingrow" data-open-cats="1"><span>카테고리 관리</span><span class="arrow">›</span></button><div class="settingslabel">기본 설정</div><div class="settingrow"><span>통화 단위</span><span class="muted">대한민국 원 (KRW)</span></div><div class="settingrow"><span>날짜 기록</span><span class="muted">날짜만 사용</span></div><div class="settingslabel">데이터</div><div class="settingrow"><span>데이터 백업·복원</span><span class="muted">서버 연결 시 구현</span></div><div class="settingrow"><span>CSV 내보내기</span><span class="muted">추후 구현</span></div><div class="settingslabel">정보</div><div class="settingrow"><span>앱 버전</span><span class="muted">UI Prototype 1.0</span></div>`}
function cats(){const group=t=>{const arr=s.cat[t];return `<div class="catgroup"><b>${t==='expense'?'지출':'수입'} 카테고리</b><button class="smalladd" data-catadd="${t}">+ 추가</button></div>${arr.map(c=>{const uses=s.records.filter(r=>r.type===t&&r.category===c).length;return `<button class="catrow" data-catedit="${esc(t)}" data-catname="${esc(c)}"><span><span class="catname">${esc(c)}</span><span class="catcnt">${uses}건 사용</span></span><span class="arrow">›</span></button>`}).join('')}`};return `<button class="back" data-back="1">‹ 설정으로</button>${header('카테고리 관리','카테고리를 추가하거나 이름을 변경하세요')}${group('expense')}${group('income')}<div class="note">사용 중인 카테고리는 기록 유실을 방지하기 위해 바로 삭제할 수 없습니다. 이름 변경은 기존 거래에도 적용됩니다.</div>`}
let chartScrollLeft=0;
function render(){const screen=$('#screen');screen.innerHTML=s.page==='categories'?cats():({home,history,stats,settings}[s.tab])();$('#nav').innerHTML=[['home','홈'],['history','내역'],['stats','통계'],['settings','설정']].map(([id,name])=>`<button data-tab="${id}" class="tab ${s.tab===id?'active':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[id]}</svg>${name}</button>`).join('');$('#fab').style.display=s.tab==='history'&&s.page==='main'?'flex':'none';const sc=$('#yearscroll');if(sc){sc.scrollLeft=chartScrollLeft;sc.addEventListener('scroll',()=>{chartScrollLeft=sc.scrollLeft},{passive:true})}}
function showSheet(html){$('#sheetbody').innerHTML=html;$('#veil').classList.add('open')}function hideSheet(){$('#veil').classList.remove('open');$('#sheetbody').innerHTML=''}
function typeButtons(t){return `<div class="typebar"><button data-entrytype="expense" class="${t==='expense'?'active':''}">지출</button><button data-entrytype="income" class="${t==='income'?'active':''}">수입</button></div>`}
function categoryButtons(t,chosen){return `<div class="chips">${s.cat[t].map(c=>`<button class="chip ${c===chosen?'active':''}" data-entrycat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
function entrySheet(tx){s.edit=tx?{...tx}:{id:null,type:'expense',category:s.cat.expense[0],amount:'',name:'',date:selected()};drawEntry()}
function drawEntry(){const e=s.edit;showSheet(`<div class="sheethead"><strong>${e.id?'거래 수정':'거래 추가'}</strong><button class="close" data-close="1">×</button></div>${typeButtons(e.type)}<label class="flabel">금액</label><div class="amountline"><span>₩</span><input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="0" value="${esc(e.amount)}"></div><label class="flabel">카테고리</label><div id="entrycats">${categoryButtons(e.type,e.category)}</div><label class="flabel">기록 날짜</label><div class="datefixed">${dateLabel(e.date)}</div><label class="flabel">내용 / 메모 (선택)</label><input class="input" id="memo" maxlength="100" placeholder="예: 점심 식사" value="${esc(e.name)}"><div class="error" id="entryerror"></div><button class="save" data-saveentry="1">${e.id?'변경사항 저장':'거래 저장'}</button>${e.id?'<button class="remove" data-askdelete="1">거래 삭제</button><div id="deleteconfirm"></div>':''}<div class="sheetfooter">날짜와 시간은 별도로 입력하지 않습니다.</div>`)}
function cacheEntry(){if(!s.edit)return;const a=$('#amount'),m=$('#memo');if(a)s.edit.amount=a.value;if(m)s.edit.name=m.value}
function catEditor(type,old){s.categoryEditor={type,old:old||null};drawCatEditor()}
function drawCatEditor(){const c=s.categoryEditor;const uses=c.old?s.records.filter(r=>r.type===c.type&&r.category===c.old).length:0;showSheet(`<div class="sheethead"><strong>${c.old?'카테고리 수정':'카테고리 추가'}</strong><button class="close" data-close="1">×</button></div><label class="flabel">유형</label><div class="datefixed">${c.type==='expense'?'지출':'수입'} 카테고리</div><label class="flabel">카테고리 이름</label><input class="input" id="catinput" maxlength="20" placeholder="카테고리 이름 입력" value="${esc(c.old||'')}"><div class="error" id="caterror"></div><button class="save" data-savecat="1">${c.old?'이름 변경 저장':'카테고리 추가'}</button>${c.old?`<button class="remove" data-deletecat="1" ${uses?'disabled':''}>카테고리 삭제</button>${uses?`<div class="removewarn">거래 ${uses}건에서 사용 중이므로 삭제할 수 없습니다. 이름은 변경할 수 있습니다.</div>`:''}`:''}`)}
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
if(b.dataset.tab){s.tab=b.dataset.tab;s.page='main';chartScrollLeft=0;render();return}
if(b.dataset.goto){s.tab=b.dataset.goto;s.page='main';render();return}
if(b.dataset.shift){const n=Number(b.dataset.shift),mode=b.dataset.mode;if(mode==='year'){s.year+=n;chartScrollLeft=0}else{const d=new Date(s.year,s.month-1+n,1);s.year=d.getFullYear();s.month=d.getMonth()+1;s.day=Math.min(s.day,new Date(s.year,s.month,0).getDate());}render();return}
if(b.dataset.day){s.day=Number(b.dataset.day);render();return}
if(b.dataset.tx){const tx=s.records.find(r=>r.id===Number(b.dataset.tx));if(tx){const [y,m,d]=tx.date.split('-').map(Number);s.year=y;s.month=m;s.day=d;entrySheet(tx)}return}
if(b.dataset.stats){s.statsMode=b.dataset.stats;chartScrollLeft=0;render();if(s.statsMode==='year'){const sc=$('#yearscroll');if(sc){sc.scrollLeft=82*7;chartScrollLeft=sc.scrollLeft}}return}
if(b.dataset.scroll){$('#yearscroll')?.scrollBy({left:Number(b.dataset.scroll)*82*3,behavior:'smooth'});return}
if(b.dataset.chartmonth){s.chartMonth=Number(b.dataset.chartmonth);render();return}
if(b.dataset.openCats){s.page='categories';render();return}
if(b.dataset.back){s.page='main';render();return}
if(b.dataset.catadd){catEditor(b.dataset.catadd,null);return}
if(b.dataset.catedit){catEditor(b.dataset.catedit,b.dataset.catname);return}
if(b.dataset.close){hideSheet();return}
if(b.dataset.entrytype){cacheEntry();s.edit.type=b.dataset.entrytype;s.edit.category=s.cat[s.edit.type][0];drawEntry();return}
if(b.dataset.entrycat){cacheEntry();s.edit.category=b.dataset.entrycat;drawEntry();return}
if(b.dataset.saveentry){cacheEntry();const a=Number(s.edit.amount);if(!Number.isSafeInteger(a)||a<=0){$('#entryerror').textContent='1원 이상의 올바른 금액을 입력하세요.';return}const next={...s.edit,amount:a,name:s.edit.name.trim()||s.edit.category};if(next.id){const index=s.records.findIndex(r=>r.id===next.id);if(index>=0)s.records[index]=next}else{next.id=++id;s.records.push(next)}hideSheet();s.tab='history';s.page='main';const [y,m,d]=next.date.split('-').map(Number);s.year=y;s.month=m;s.day=d;render();return}
if(b.dataset.askdelete){$('#deleteconfirm').innerHTML='<div class="confirmbox">이 거래를 삭제할까요?<div class="confirmbuttons"><button data-canceldelete="1">취소</button><button class="confirm" data-confirmdelete="1">삭제</button></div></div>';return}
if(b.dataset.canceldelete){$('#deleteconfirm').innerHTML='';return}
if(b.dataset.confirmdelete){s.records=s.records.filter(r=>r.id!==s.edit.id);hideSheet();render();return}
if(b.dataset.savecat){const c=s.categoryEditor,newName=$('#catinput').value.trim();if(!newName){$('#caterror').textContent='이름을 입력하세요.';return}if(s.cat[c.type].some(v=>v===newName&&v!==c.old)){$('#caterror').textContent='같은 유형에 이미 있는 카테고리입니다.';return}if(c.old){s.cat[c.type]=s.cat[c.type].map(v=>v===c.old?newName:v);s.records.forEach(r=>{if(r.type===c.type&&r.category===c.old)r.category=newName})}else{s.cat[c.type].push(newName)}hideSheet();render();return}
if(b.dataset.deletecat){const c=s.categoryEditor;if(s.records.some(r=>r.type===c.type&&r.category===c.old))return;s.cat[c.type]=s.cat[c.type].filter(v=>v!==c.old);hideSheet();render();return}
});
$('#fab').addEventListener('click',()=>entrySheet(null));$('#veil').addEventListener('click',e=>{if(e.target===$('#veil'))hideSheet()});
render();
})();
</script></body></html>
